<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loader Preview</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── LOADER OVERLAY ─────────────────────────────────────── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.9s cubic-bezier(0.76, 0, 0.24, 1),
                  visibility 0.9s;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Video fills the entire screen — crops edges like a background-cover */
    #loader-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;   /* ← KEY: this is what makes it truly full-screen */
      object-position: center;
    }

    /* Progress bar at the very bottom */
    #loader-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,0.12);
      z-index: 2;
    }

    #loader-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.6) 100%);
      transition: width 0.1s linear;
      box-shadow: 0 0 10px rgba(255,255,255,0.6);
    }

    /* Skip button (optional — remove if you don't want it) */
    #loader-skip {
      position: absolute;
      bottom: 24px;
      right: 28px;
      z-index: 3;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 8px 20px;
      border-radius: 100px;
      font-size: 13px;
      letter-spacing: 0.04em;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.2s, color 0.2s;
      opacity: 0;
      animation: fadeInSkip 0.5s 1.5s forwards;
    }

    #loader-skip:hover {
      background: rgba(255,255,255,0.18);
      color: #fff;
    }

    @keyframes fadeInSkip {
      to { opacity: 1; }
    }

    /* ── YOUR PAGE CONTENT (demo only) ─────────────────────── */
    #page-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      text-align: center;
      padding: 40px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.8s 0.2s ease, transform 0.8s 0.2s ease;
    }

    #page-content.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #page-content h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }

    #page-content p {
      font-size: 1rem;
      color: rgba(255,255,255,0.45);
      max-width: 420px;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════
       LOADER  —  paste this block at the very top of
       your <body> in your own website
       ═══════════════════════════════════════════════════ -->
  <div id="loader">
    <video
      id="loader-video"
      src="loader.mp4"
      autoplay
      muted
      playsinline
      preload="auto"
    ></video>

    <!-- progress bar -->
    <div id="loader-progress-track">
      <div id="loader-progress-fill"></div>
    </div>

    <!-- skip button — delete this <button> if you don't want it -->
    <button id="loader-skip" onclick="dismissLoader()">Skip ↗</button>
  </div>
  <!-- ═══════════════════════════════════════════════════ -->


  <!-- Your actual website content goes here -->
  <div id="page-content">
    <h1>Welcome to my website</h1>
    <p>Your page content lives here. The loader fades out smoothly once the animation finishes.</p>
  </div>


  <script>
    const video    = document.getElementById('loader-video');
    const fill     = document.getElementById('loader-progress-fill');
    const loader   = document.getElementById('loader');
    const content  = document.getElementById('page-content');

    // Track progress
    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        fill.style.width = (video.currentTime / video.duration * 100) + '%';
      }
    });

    // Auto-dismiss when video ends
    video.addEventListener('ended', dismissLoader);

    // Safety fallback: dismiss after 12 s even if video stalls
    const fallback = setTimeout(dismissLoader, 12000);

    function dismissLoader() {
      clearTimeout(fallback);
      fill.style.width = '100%';               // complete the bar
      setTimeout(() => {
        loader.classList.add('hidden');         // fade out loader
        content.classList.add('visible');       // fade in page
      }, 200);
    }
  </script>
</body>
</html>
